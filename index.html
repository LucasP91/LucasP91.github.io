    <style>
      :root {
        --bg: #050608;
        --text: #e8ecf4;
        --muted: #9aa3b2;
        --accent: #7aa2ff;
        --line: rgb(255 255 255 / 0.14);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        padding-inline: 1.5rem;
        background:
          radial-gradient(60rem 40rem at 80% -10%, rgb(122 162 255 / 0.10), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.55;
        display: grid;
        place-items: center;
      }
      main { width: 100%; max-width: 40rem; padding-block: 4rem; }
      .portrait {
        display: block;
        width: clamp(7rem, 4rem + 9vw, 10rem);
        height: auto;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 50%;
        border: 1px solid var(--line);
        box-shadow: 0 0 0 8px rgb(122 162 255 / 0.08), 0 8px 30px rgb(0 0 0 / 0.3);
        margin-bottom: 2rem;
      }
      .eyebrow {
        margin: 0 0 0.5rem;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 1.6rem + 3vw, 3.6rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p.lede { margin: 0 0 2rem; font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem); color: var(--muted); max-width: 34rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
      .btn {
        display: inline-block;
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        transition: background-color 150ms, border-color 150ms;
      }
      .btn:hover { border-color: rgb(255 255 255 / 0.3); background: rgb(255 255 255 / 0.05); }
      .btn--primary { background: var(--accent); border-color: var(--accent); color: #050608; }
      .btn--primary:hover { background: #99b8ff; border-color: #99b8ff; }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>

      </div>
    </main>
